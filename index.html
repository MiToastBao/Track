  <script>
    // 每次發布新版本時，把這個字串換掉（日期或流水號都可以）。
    // Service Worker 的註冊網址會帶上這個版本號當查詢字串，
    // 瀏覽器會把它視為「不同的 sw.js 網址」而強制重新抓取、重新安裝，
    // 才能保證每次更新 index.html 後，使用者的裝置真的會抓到新版本
    // （否則瀏覽器只會比對 sw.js 本身的內容有沒有變，這裡沒變就永遠判斷「已是最新」）。
    const APP_VERSION='2026.07.23-8';
    // uuid() 只在安全情境（https/localhost）且較新瀏覽器才存在；
    // 沒有的話（例如較舊的 iOS Safari、部分內嵌 WebView、或以 file:// 開啟）就退回手刻版本，
    // 避免頁面一載入就因為 ReferenceError 直接白屏。
    const uuid=()=>{
      if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'){
        try{return crypto.randomUUID()}catch{}
      }
      if(typeof crypto!=='undefined'&&typeof crypto.getRandomValues==='function'){
        const bytes=crypto.getRandomValues(new Uint8Array(16));
        bytes[6]=(bytes[6]&0x0f)|0x40;
        bytes[8]=(bytes[8]&0x3f)|0x80;
        const hex=[...bytes].map(b=>b.toString(16).padStart(2,'0'));
        return `${hex.slice(0,4).join('')}-${hex.slice(4,6).join('')}-${hex.slice(6,8).join('')}-${hex.slice(8,10).join('')}-${hex.slice(10,16).join('')}`;
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
        const r=Math.random()*16|0;
        return(c==='x'?r:(r&0x3|0x8)).toString(16);
      });
    };
    const loadMemory=key=>{try{return JSON.parse(localStorage.getItem(key))||[]}catch{return[]}};
    const applyTheme=theme=>{document.documentElement.setAttribute('data-theme',theme);document.querySelectorAll('#themeSwitch [data-theme-choice]').forEach(btn=>btn.classList.toggle('active',btn.dataset.themeChoice===theme))};
    let currentTheme='light';
    try{currentTheme=localStorage.getItem('battleTrackerTheme')||'light'}catch{}
    applyTheme(currentTheme);
    let storageErrorNotified=false;
    function notifyStorageError(err){
      console.error('localStorage \u5beb\u5165\u5931\u6557',err);
      if(storageErrorNotified)return;
      storageErrorNotified=true;
      alert('\u26a0\ufe0f \u5132\u5b58\u5931\u6557\uff1a\u700f\u89bd\u5668\u5132\u5b58\u7a7a\u9593\u53ef\u80fd\u5df2\u6eff\u6216\u7121\u6cd5\u4f7f\u7528\uff0c\u76ee\u524d\u7684\u8b8a\u66f4\u66ab\u6642\u4e0d\u6703\u4fdd\u5b58\u5230\u672c\u6a5f\uff0c\u91cd\u65b0\u6574\u7406\u9801\u9762\u5f8c\u53ef\u80fd\u907a\u5931\u3002\u5efa\u8b70\u7acb\u5373\u4f7f\u7528\u300c\u532f\u51fa\u5099\u4efd\u300d\u4fdd\u5b58\u76ee\u524d\u9032\u5ea6\uff0c\u4e26\u8003\u616e\u522a\u9664\u90e8\u5206\u8206\u56b7\u7684\u5b58\u6a94\u6216\u7bc4\u672c\u5f8c\u518d\u8a66\u3002');
    }
    let storageUsageTimer=null;
    function scheduleStorageUsageUpdate(){
      // 純粹統計字串長度，成本很低，但還是稍微 debounce 一下，
      // 避免連續多次寫入（例如匯入備份時一次寫好幾把 key）時重複跑好幾次。
      if(storageUsageTimer)clearTimeout(storageUsageTimer);
      storageUsageTimer=setTimeout(()=>{storageUsageTimer=null;updateStorageUsageDisplay()},400);
    }
    function formatKb(bytes){
      const kb=bytes/1024;
      if(kb<1)return'<1 KB';
      if(kb<10)return`${kb.toFixed(1)} KB`;
      if(kb<1024)return`${Math.round(kb)} KB`;
      return`${(kb/1024).toFixed(1)} MB`;
    }
    function storageBreakdownHtml(sizes,totalBytes){
      const clearableKeys=STORAGE_CATEGORIES.filter(cat=>cat.clear&&cat.count()>0).map(cat=>cat.key);
      const clearableSet=new Set(clearableKeys);
      selectedCleanupKeys.forEach(k=>{if(!clearableSet.has(k))selectedCleanupKeys.delete(k)});
      const rows=STORAGE_CATEGORIES.map(cat=>{
        const bytes=sizes[cat.key]||0;
        const count=cat.count();
        const countText=cat.unit?`${count} ${cat.unit}\u00b7`:'';
        const checkbox=cat.clear?`<input type="checkbox" data-cleanup-select="${cat.key}" ${selectedCleanupKeys.has(cat.key)?'checked':''} ${count?'':'disabled'} aria-label="\u9078\u53d6\u6e05\u9664\u9805\u76ee">`:'<span class="storage-row-spacer"></span>';
        const clearBtn=cat.clear?`<button type="button" class="danger" data-cleanup-clear="${cat.key}" ${count?'':'disabled'}>\u6e05\u9664</button>`:'';
        return`<div class="storage-row">${checkbox}<span class="storage-row-label">${escapeHtml(cat.label)}</span><span class="storage-row-meta">${countText}${formatKb(bytes)}</span>${clearBtn}</div>`;
      }).join('');
      const allSelected=clearableKeys.length>0&&clearableKeys.every(k=>selectedCleanupKeys.has(k));
      const toolbar=clearableKeys.length?`<div class="storage-row storage-toolbar-row"><label class="squad-option" style="padding:4px"><input type="checkbox" id="cleanupSelectAll" ${allSelected?'checked':''}> \u5168\u9078\u53ef\u6e05\u9664\u9805\u76ee</label><button type="button" class="danger" id="btnClearSelectedCleanup" ${selectedCleanupKeys.size?'':'disabled'}>\u6e05\u9664\u5df2\u9078 (${selectedCleanupKeys.size})</button></div>`:'';
      return`${toolbar}${rows}<div class="storage-row storage-total-row"><span class="storage-row-label">\u7e3d\u8a08</span><span class="storage-row-meta">${formatKb(totalBytes)}</span></div>`;
    }
    function updateStorageUsageDisplay(){
      const el=document.querySelector('#storageUsage');
      const breakdownEl=document.querySelector('#storageBreakdown');
      if(!el&&!breakdownEl)return;
      let bytes=0;
      const sizes={};
      try{
        for(let i=0;i<localStorage.length;i++){
          const key=localStorage.key(i);
          if(!key||key.indexOf('battleTracker')!==0)continue;
          const value=localStorage.getItem(key)||'';
          // UTF-16 in JS 字串每字元約 2 bytes，粗估即可，不用精確到 byte。
          const keyBytes=(key.length+value.length)*2;
          sizes[key]=keyBytes;
          bytes+=keyBytes;
        }
      }catch{
        if(el)el.textContent='';
        if(breakdownEl)breakdownEl.innerHTML='';
        return;
      }
      const kb=bytes/1024;
      if(el){
        const text=kb<1024?`&#128190; \u672c\u6a5f\u5132\u5b58\u5df2\u4f7f\u7528\u7d04 ${kb.toFixed(kb<10?1:0)} KB`:`&#128190; \u672c\u6a5f\u5132\u5b58\u5df2\u4f7f\u7528\u7d04 ${(kb/1024).toFixed(1)} MB`;
        el.innerHTML=kb>4096?`${text}&#65288;&#26371;&#25235;\u8fd1\u700f\u89bd\u5668\u5132\u5b58\u4e0a\u9650\uff0c\u5efa\u8b70\u5148\u532f\u51fa\u5099\u4efd\u4e26\u6e05\u7406\u4e0d\u9700\u8981\u7684\u5b58\u6a94\u2192`:text;
      }
      if(breakdownEl)breakdownEl.innerHTML=storageBreakdownHtml(sizes,bytes);
    }
    function setStorageItem(key,raw){
      try{
        localStorage.setItem(key,raw);
        storageErrorNotified=false;
        scheduleStorageUsageUpdate();
        return true;
      }catch(err){
        notifyStorageError(err);
        scheduleStorageUsageUpdate();
        return false;
      }
    }
    document.querySelector('#themeSwitch').addEventListener('click',event=>{const btn=event.target.closest('[data-theme-choice]');if(!btn)return;currentTheme=btn.dataset.themeChoice;applyTheme(currentTheme);setStorageItem('battleTrackerTheme',currentTheme)});
    let wakeLock=null;
    let keepScreenAwakePref=false;
    try{keepScreenAwakePref=localStorage.getItem('battleTrackerWakeLock')==='on'}catch{}
    function updateWakeLockButton(){
      const btn=document.querySelector('#toggleWakeLock');
      btn.textContent=keepScreenAwakePref?'\ud83d\udd06 \u4fdd\u6301\u87a2\u5e55\u958b\u555f\uff1a\u958b':'\ud83d\udd06 \u4fdd\u6301\u87a2\u5e55\u958b\u555f\uff1a\u95dc';
      btn.classList.toggle('good',keepScreenAwakePref);
      btn.title=keepScreenAwakePref?'\u87a2\u5e55\u4e0d\u6703\u81ea\u52d5\u719f\u7761\uff0c\u9ede\u64ca\u53ef\u95dc\u9589\u3002':'\u87a2\u5e55\u6703\u4f9d\u624b\u6a5f/\u5e73\u677f\u8a2d\u5b9a\u81ea\u52d5\u719f\u7761\uff0c\u9ede\u64ca\u53ef\u4fdd\u6301\u5e38\u4eae\u3002';
    }
    async function requestWakeLock(){
      if(!('wakeLock' in navigator))return false;
      try{
        wakeLock=await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release',()=>{wakeLock=null});
        return true;
      }catch(err){
        console.error('Wake Lock \u8981\u6c42\u5931\u6557',err);
        return false;
      }
    }
    function releaseWakeLock(){
      if(wakeLock){try{wakeLock.release()}catch{}wakeLock=null}
    }
    document.querySelector('#toggleWakeLock').addEventListener('click',async()=>{
      keepScreenAwakePref=!keepScreenAwakePref;
      try{localStorage.setItem('battleTrackerWakeLock',keepScreenAwakePref?'on':'off')}catch{}
      updateWakeLockButton();
      if(keepScreenAwakePref){
        const ok=await requestWakeLock();
        if(!ok){
          alert('\u6b64\u700f\u89bd\u5668\u6216\u4f5c\u696d\u7cfb\u7d71\u7248\u672c\u4e0d\u652f\u63f4\u4fdd\u6301\u87a2\u5e55\u958b\u555f\u529f\u80fd\uff08iOS \u9700 16.4 \u4ee5\u4e0a\uff0cAndroid \u5efa\u8b70\u4f7f\u7528 Chrome\uff09\uff0c\u8acb\u624b\u52d5\u8abf\u6574\u88dd\u7f6e\u7684\u81ea\u52d5\u719f\u7761\u6642\u9593\u3002');
        }
      }else{
        releaseWakeLock();
      }
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'&&keepScreenAwakePref&&!wakeLock)requestWakeLock();
    });
    updateWakeLockButton();
    if(keepScreenAwakePref)requestWakeLock();
    let swRegistration=null;
    let updateCheckResolver=null;
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register(`./sw.js?v=${encodeURIComponent(APP_VERSION)}`,{updateViaCache:'none'})
          .then(reg=>{swRegistration=reg})
          .catch(err=>console.error('Service Worker \u8a3b\u518a\u5931\u6557',err));
      });
      navigator.serviceWorker.addEventListener('message',event=>{
        if(!(event.data&&event.data.type==='SW_UPDATED'))return;
        if(updateCheckResolver){const resolve=updateCheckResolver;updateCheckResolver=null;resolve(true)}
        else showUpdateBanner();

    function unitSig(unit){
      let s=unit.id+'|'+unit.name+'|'+unit.hp+'|'+unit.maxHp+'|'+unit.color+'|'+(unit.turnEnded?1:0)+'|'+(unit.isBoss?1:0)+'|'+(unit.squadId||'');
      const statuses=unit.statuses;
      if(statuses&&statuses.length){s+='|S';for(let i=0;i<statuses.length;i++){const x=statuses[i];s+=x.id+','+x.kind+','+x.name+','+x.turns+';'}}
      const attributes=unit.attributes;
      if(attributes&&attributes.length){s+='|A';for(let i=0;i<attributes.length;i++){const x=attributes[i];s+=x.id+','+x.name+','+x.value+','+x.color+';'}}
      const bars=unit.bars;
      if(bars&&bars.length){s+='|B';for(let i=0;i<bars.length;i++){const x=bars[i];s+=x.id+','+x.name+','+x.value+','+x.maxValue+','+x.color+';'}}
      const passives=unit.passives;
      if(passives&&passives.length){s+='|P';for(let i=0;i<passives.length;i++){const x=passives[i];s+=x.id+','+x.name+','+x.color+';'}}
      const cards=unit.actionCards;
      if(cards&&cards.length){s+='|C';for(let i=0;i<cards.length;i++){const x=cards[i];s+=x.id+','+x.name+','+(x.turnEnded?1:0)+';'}}
      const thresholds=unit.hpThresholds;
      if(thresholds&&thresholds.length){s+='|T';for(let i=0;i<thresholds.length;i++){const x=thresholds[i];s+=x.id+','+x.value+','+x.passiveName+','+(x.triggered?1:0)+','+(x.autoRemove?1:0)+';'}}
      return s;
    }
    function unitsSig(units){

      // 避免像 JSON.stringify(units) 那樣把整包物件（含所有 key 名稱）重新序列化一次。
      let s='';
      for(let i=0;i<units.length;i++)s+=unitSig(units[i])+'##';
      return s;
    }
    function reconcileCardGrid(container,units,emptyHtml,contextSig){
      if(!units.length){container.innerHTML=emptyHtml;return}
      if(container.firstElementChild&&!container.firstElementChild.classList.contains('card')){container.innerHTML=''}
      const existing=new Map();
      container.querySelectorAll(':scope > .card').forEach(node=>existing.set(node.dataset.cardId,node));
      let cursor=container.firstElementChild;
      units.forEach(unit=>{
        let node=existing.get(unit.id);
        let squadSig='';
        if(unit.type==='monster'&&unit.squadId){
          const squad=findSquad(unit.squadId);
          const members=squadMembers(unit.squadId);
          squadSig='|SQ:'+(squad?squad.name:'')+':'+members.map(m=>m.id+','+m.hp).join(';');
        }
        const sig=contextSig+'|M:'+(expandedManageIds.has(unit.id)?1:0)+squadSig+'|U:'+unitSig(unit);
        const unchanged=node&&cardSigCache.get(unit.id)===sig;
        if(!unchanged){
          const html=cardHtml(unit);
          cardSigCache.set(unit.id,sig);
          if(node){
            existing.delete(unit.id);
            if(node.outerHTML!==html){
              const tpl=document.createElement('template');
              tpl.innerHTML=html;
              const fresh=tpl.content.firstElementChild;
              if(cursor===node)cursor=fresh;
              node.replaceWith(fresh);
              node=fresh;
            }
          }else{
            const tpl=document.createElement('template');
            tpl.innerHTML=html;
            node=tpl.content.firstElementChild;
            container.insertBefore(node,cursor);
          }
        }else{
          existing.delete(unit.id);
        }
        if(node!==cursor)container.insertBefore(node,cursor);
        cursor=node.nextElementSibling;
      });

    function initiativeEligibleIds(){

      monsters.forEach(m=>{
        if(m.squadId&&findSquad(m.squadId)){
          if(seenSquads.has(m.squadId))return;
          seenSquads.add(m.squadId);
          if(squadAliveCount(m.squadId)>0)ids.push('squad:'+m.squadId);
        }else if(m.isBoss&&Array.isArray(m.actionCards)&&m.actionCards.length){
          m.actionCards.forEach(card=>ids.push(`card:${m.id}:${card.id}`));
        }else{
          ids.push(m.id);
        }
      });
      return ids;
    }

          if(!alive.length)return null;
          const ended=alive.every(m=>m.turnEnded);
          return {id,color:squad.color,label:`&#128737; ${escapeHtml(squad.name)} &#215;${squadAliveCount(squad.id)}`,plainName:`${squad.name} \u00d7${squadAliveCount(squad.id)}`,ended,members:alive};

        if(id.startsWith('card:')){
          const[,unitId,cardId]=id.split(':');

          if(!unit||!Array.isArray(unit.actionCards))return null;
          const card=unit.actionCards.find(c=>c.id===cardId);
          if(!card)return null;
          const cardIndex=unit.actionCards.indexOf(card)+1;

    /* ==================== 商店系統模組（獨立於戰鬥追蹤資料） ==================== */
    function loadShopData(){
      const fallback={teamGold:0,shopCatalog:[],shopUnlockedLevels:[],shopUnlockedLevelCats:[]};
      try{
        const raw=localStorage.getItem('battleTrackerShopData');
        if(raw===null)return fallback;
        const sd=sanitizeShopData(JSON.parse(raw));
        return sd||fallback;
      }catch{return fallback}
    }
    let {teamGold,shopCatalog,shopUnlockedLevels,shopUnlockedLevelCats}=loadShopData();
    function saveShopData(){saveMemory('battleTrackerShopData',{teamGold,shopCatalog,shopUnlockedLevels,shopUnlockedLevelCats})}
    let shopAutosaveTimer=null;
    function scheduleShopAutosave(){
      if(shopAutosaveTimer)clearTimeout(shopAutosaveTimer);
      shopAutosaveTimer=setTimeout(()=>{shopAutosaveTimer=null;saveShopData()},300);
    }
    function flushShopAutosave(){
      if(shopAutosaveTimer){clearTimeout(shopAutosaveTimer);shopAutosaveTimer=null}
      saveShopData();
    }
    window.addEventListener('beforeunload',flushShopAutosave);
    window.addEventListener('pagehide',flushShopAutosave);

    function getCardGroup(name){
      const group=new Set([name]);
      shopCatalog.forEach(t=>{
        if(t.name===name&&Array.isArray(t.linkedNames))t.linkedNames.forEach(n=>group.add(n));
        if(Array.isArray(t.linkedNames)&&t.linkedNames.includes(name))group.add(t.name);
      });
      return Array.from(group);
    }
    function getShopCap(name){
      const group=getCardGroup(name);
      for(const n of group){const it=shopCatalog.find(x=>x.name===n);if(it&&it.cap!=null)return it.cap}
      return null;
    }
    function usedInShopGroup(name){
      const group=getCardGroup(name);
      return group.reduce((s,n)=>{const it=shopCatalog.find(x=>x.name===n);return s+(it?(it.boughtCount||0):0)},0);
    }
    function canBuyShopItem(item){
      if((item.price||0)>teamGold)return false;
      const cap=getShopCap(item.name);
      if(cap==null)return true;
      return usedInShopGroup(item.name)<cap;
    }
    function syncShopLinkedCounterpart(item){
      const backName=(item.backName||'').trim();
      if(!backName||backName===item.name)return null;
      let counterpart=shopCatalog.find(x=>x.name===backName);
      if(!counterpart){
        counterpart={id:uuid(),name:backName,category:(item.backCategory||'').trim(),level:item.level||'',price:null,cap:null,boughtCount:0,individuallyOpen:false,linkedNames:[item.name]};
        shopCatalog.push(counterpart);
      }else{
        if((item.backCategory||'').trim())counterpart.category=item.backCategory.trim();
        if(!counterpart.linkedNames)counterpart.linkedNames=[];
        if(!counterpart.linkedNames.includes(item.name))counterpart.linkedNames.push(item.name);
      }
      if(!item.linkedNames)item.linkedNames=[];
      if(!item.linkedNames.includes(backName))item.linkedNames.push(backName);
      return counterpart;
    }
    function renameShopCardEverywhere(oldName,newName){
      newName=(newName||'').trim();
      if(!newName||oldName===newName)return true;
      const existingOthers=shopCatalog.filter(t=>t.name===newName);
      if(existingOthers.length){
        if(!confirm(`已經有「${newName}」了，要合併成一張嗎？（庫存數量會加總，上限取其中一個有設定的值）`))return false;
      }
      shopCatalog.forEach(it=>{
        if(it.name===oldName)it.name=newName;
        if(it.linkedNames)it.linkedNames=it.linkedNames.map(n=>n===oldName?newName:n);
        if(it.backName===oldName)it.backName=newName;
      });
      const dupes=shopCatalog.filter(t=>t.name===newName);
      if(dupes.length>1){
        const keep=dupes[0];
        for(let i=1;i<dupes.length;i++){
          keep.boughtCount=(keep.boughtCount||0)+(dupes[i].boughtCount||0);
          if(keep.cap==null)keep.cap=dupes[i].cap;
          if(!keep.category)keep.category=dupes[i].category;
          shopCatalog=shopCatalog.filter(x=>x!==dupes[i]);
        }
      }
      return true;
    }

    let shopLevelFilter='',shopCatFilter='';

    function visibleShopItems(){

    function shopCardHtml(it){
      const cap=getShopCap(it.name);
      const used=usedInShopGroup(it.name);
      const avail=cap!=null?Math.max(0,cap-used):null;
      const outOfStock=avail!=null&&avail<=0;
      const canAfford=teamGold>=(it.price||0);
      const buyOk=!outOfStock&&canAfford;
      const sellOk=(it.boughtCount||0)>0;
      return `<div class="shop-card"><div class="shop-card-name">${escapeHtml(it.name||'未命名')}</div><div class="shop-card-badge">${it.level?`Lv${escapeHtml(it.level)} · `:''}${it.price||0}💰${avail!=null?` · 剩${avail}`:''}</div><div class="shop-card-owned">已持有：${it.boughtCount||0} 件</div><div class="shop-card-actions"><button class="shop-sell-btn" data-shop-sell="${it.id}" ${sellOk?'':'disabled'}>－ 賣出</button><span class="shop-qty">${it.boughtCount||0}</span><button class="shop-buy-btn" data-shop-buy="${it.id}" ${buyOk?'':'disabled'}>${outOfStock?'已達上限':(!canAfford?'金庫不足':'＋ 購買')}</button></div></div>`;
    }

      wrap.innerHTML=`

        <div class="shop-hint" style="margin:8px 0 4px;font-weight:700">依分類篩選</div>
        <div class="shop-cat-tabs"><button class="shop-cat-tab ${!shopCatFilter?'active':''}" data-shop-cat="">全部分類</button>${catsInLevel.map(c=>`<button class="shop-cat-tab ${shopCatFilter===c?'active':''}" data-shop-cat="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('')}</div>
        ${body}
      `;
      wrap.querySelectorAll('details[data-shopsec]').forEach(d=>{
        d.addEventListener('toggle',()=>{const id=d.dataset.shopsec;if(d.open)openShopSections.add(id);else openShopSections.delete(id)});
      });
    }
    document.querySelector('#shopPanelContent')?.addEventListener('click',ev=>{
      const lvlTab=ev.target.closest('[data-shop-lvl]');
      if(lvlTab){
        shopLevelFilter=lvlTab.dataset.shopLvl;shopCatFilter='';
        const items=visibleShopItems().filter(it=>!shopLevelFilter||(it.level||'（無等級）')===shopLevelFilter);
        Array.from(new Set(items.map(it=>it.category||'未分類'))).forEach(cat=>openShopSections.add('shop:'+(shopLevelFilter||'all')+':'+cat));
        renderShopPanel();return;
      }
      const catTab=ev.target.closest('[data-shop-cat]');
      if(catTab){
        shopCatFilter=catTab.dataset.shopCat;
        const items=visibleShopItems().filter(it=>!shopLevelFilter||(it.level||'（無等級）')===shopLevelFilter).filter(it=>!shopCatFilter||(it.category||'未分類')===shopCatFilter);
        Array.from(new Set(items.map(it=>it.category||'未分類'))).forEach(cat=>openShopSections.add('shop:'+(shopLevelFilter||'all')+':'+cat));
        renderShopPanel();return;
      }
      const goldBtn=ev.target.closest('[data-shop-gd]');
      if(goldBtn){teamGold=Math.max(0,(teamGold||0)+parseInt(goldBtn.dataset.shopGd,10));scheduleShopAutosave();renderShopPanel();return}
      const goldEdit=ev.target.closest('#shopGoldEdit');
      if(goldEdit){
        const val=prompt('輸入金額：',teamGold||0);if(val===null)return;
        const num=parseInt(val,10);if(isNaN(num))return;
        teamGold=Math.max(0,num);scheduleShopAutosave();renderShopPanel();return;
      }
      const goldCustomBtn=ev.target.closest('[data-shop-goldcustom]');
      if(goldCustomBtn){
        const input=document.querySelector('#shopGoldCustomInput');
        const amt=parseInt(input.value,10);
        if(isNaN(amt)||amt<0){alert('請先輸入有效的正整數');return}
        const dir=parseInt(goldCustomBtn.dataset.shopGoldcustom,10);
        teamGold=Math.max(0,(teamGold||0)+dir*amt);
        scheduleShopAutosave();renderShopPanel();return;
      }
      const buyBtn=ev.target.closest('[data-shop-buy]');
      if(buyBtn&&!buyBtn.disabled){
        const item=shopCatalog.find(x=>x.id===buyBtn.dataset.shopBuy);
        if(item&&canBuyShopItem(item)){
          item.boughtCount=(item.boughtCount||0)+1;
          teamGold-=(item.price||0);
          scheduleShopAutosave();renderShopPanel();
        }
        return;
      }
      const sellBtn=ev.target.closest('[data-shop-sell]');
      if(sellBtn&&!sellBtn.disabled){
        const item=shopCatalog.find(x=>x.id===sellBtn.dataset.shopSell);
        if(item&&(item.boughtCount||0)>0){
          const val=prompt(`「${item.name}」要賣多少錢？`,item.price||0);
          if(val===null)return;
          const price=parseInt(val,10);
          if(isNaN(price)||price<0){alert('請輸入有效金額');return}
          item.boughtCount-=1;
          teamGold+=price;
          scheduleShopAutosave();renderShopPanel();
        }
        return;
      }
    });

    /* ---- GM 區渲染 ---- */
    let gmShopFilter=null;
    function linkStatusHtml(it){
      const backName=(it.backName||'').trim();
      if(!backName)return'';
      const isLinked=it.linkedNames&&it.linkedNames.includes(backName);
      if(isLinked)return`<div class="shop-hint" style="color:var(--danger)">✅ 已連動：${escapeHtml(backName)}</div>`;
      return`<div class="shop-hint" style="color:var(--danger);font-weight:700">⚠️ 連動尚未建立</div><button type="button" class="gm-force-link" data-gm-force="${it.id}" style="width:100%;margin-top:4px">🔗 立即建立連動</button>`;
    }
    function gmCatalogCardHtml(it){
      const fields=`
        <input type="text" class="gm-f" data-gm-f="name" data-gm-id="${it.id}" placeholder="商品名稱" value="${escapeAttr(it.name)}">
        <input type="text" class="gm-f" data-gm-f="category" data-gm-id="${it.id}" placeholder="分類，例如 武器" value="${escapeAttr(it.category||'')}">
        <input type="text" class="gm-f gm-regroup" data-gm-f="level" data-gm-id="${it.id}" placeholder="等級" value="${escapeAttr(it.level||'')}">
        <input type="number" class="gm-f" data-gm-f="price" data-gm-id="${it.id}" placeholder="本格輸入售價" value="${it.price==null?'':it.price}" min="0">
        <div class="shop-hint" style="margin:-4px 0 5px">↑ 商品售價</div>
        <input type="number" class="gm-f" data-gm-f="cap" data-gm-id="${it.id}" placeholder="數量上限（留空無限）" value="${it.cap==null?'':it.cap}" min="0">
        <label class="gm-indiv-check"><input type="checkbox" class="gm-indiv" data-gm-id="${it.id}" ${it.individuallyOpen?'checked':''}> 單獨開放（不受等級開關限制）</label>
        <div class="shop-hint" style="margin:8px 0 4px;font-weight:700;color:var(--danger)">🔗 雙面卡（選填，正反面共用同一份庫存上限）</div>
        <input type="text" class="gm-f gm-link" data-gm-f="backName" data-gm-id="${it.id}" placeholder="背面名稱" value="${escapeAttr(it.backName||'')}">
        <input type="text" class="gm-f gm-link" data-gm-f="backCategory" data-gm-id="${it.id}" placeholder="背面分類" value="${escapeAttr(it.backCategory||'')}">

      return`<div class="shop-card" id="gmcard-${it.id}"><div class="gm-inputs">${fields}</div><button type="button" class="danger gm-del-btn" data-gm-del="${it.id}" style="width:100%;margin-top:6px">🗑 刪除這張卡</button></div>`;
    }
    function renderGmShopSection(){
      const allLevels=Array.from(new Set(shopCatalog.map(it=>it.level||'未分級')));
      const levels=(gmShopFilter&&gmShopFilter.level)?allLevels.filter(lv=>lv===gmShopFilter.level):allLevels;
      const filterNote=gmShopFilter?`<div class="shop-hint" style="color:var(--primary);margin-bottom:10px;font-weight:700">🔍 篩選中：${gmShopFilter.level?escapeHtml(gmShopFilter.level):'全部等級'} / ${gmShopFilter.category?escapeHtml(gmShopFilter.category):'全部分類'}（點左下角🧭可清除）</div>`:'';
      const body=levels.map(lv=>{
        const itemsInLevel=shopCatalog.filter(it=>(it.level||'未分級')===lv);
        const isNone=lv==='未分級';
        const unlocked=isNone?true:shopUnlockedLevels.includes(lv);
        const allCats=Array.from(new Set(itemsInLevel.map(it=>it.category||'未分類')));
        const cats=(gmShopFilter&&gmShopFilter.category)?allCats.filter(c=>c===gmShopFilter.category):allCats;
        const catBody=cats.map(cat=>{
          const items=itemsInLevel.filter(it=>(it.category||'未分類')===cat);
          const lcKey=levelCatKey(lv,cat);
          const lcOpen=shopUnlockedLevelCats.includes(lcKey);
          const catCheckbox=`<label class="gm-indiv-check" style="margin-bottom:8px"><input type="checkbox" class="lc-check" data-lc-key="${escapeAttr(lcKey)}" ${lcOpen?'checked':''}> 單獨開放「${escapeHtml(lv)}」裡的「${escapeHtml(cat)}」分類到商店（不受上方等級開關影響）</label>`;
          return shopSectionHtml('gmshop:'+lv+':'+cat,`${escapeHtml(cat)}（${items.length}）`,`${catCheckbox}<div class="shop-grid">${items.map(gmCatalogCardHtml).join('')}</div>`);
        }).join('');
        return`<div style="margin-bottom:16px"><label class="gm-level-check"><input type="checkbox" class="lvl-check" data-gm-lvl="${escapeAttr(lv)}" ${unlocked?'checked':''} ${isNone?'disabled':''}><span>${escapeHtml(lv)}${isNone?'（永遠開放）':''}（${itemsInLevel.length}）</span></label>${catBody}</div>`;
      }).join('');
      return`
        <button type="button" class="primary" data-gm-addcard="1" style="width:100%;margin-bottom:10px">＋ 新增商品</button>
        <p class="shop-hint" style="margin:0 0 12px">設定名稱、分類、等級、價格、數量上限；勾選等級即可開放到商店分頁（沒填等級的商品永遠開放），也可以單獨勾選某張卡「單獨開放」不受等級開關限制。點左下角 🧭 可以篩選只看特定等級+分類組合。</p>
        ${filterNote}
        ${body||'<p class="empty">還沒有商品。</p>'}
      `;
    }
    function addBlankShopCard(){
      const item={id:uuid(),name:'',category:'',level:'',price:null,cap:null,boughtCount:0,individuallyOpen:false,linkedNames:[]};
      shopCatalog.push(item);
      scheduleShopAutosave();renderGmPanel();
      requestAnimationFrame(()=>{
        const el=document.getElementById('gmcard-'+item.id);
        if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const nameInput=el.querySelector('.gm-f[data-gm-f="name"]');if(nameInput)setTimeout(()=>nameInput.focus(),250)}
      });
    }
    function ensureXLSXLoaded(){
      if(window.XLSX)return Promise.resolve(true);
      return new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload=()=>resolve(true);
        s.onerror=()=>reject(new Error('load failed'));
        document.head.appendChild(s);
      });
    }
    function downloadShopExcelTemplate(){
      ensureXLSXLoaded().then(()=>{
        const templateRows=[
          ['名稱','分類','等級','價格','數量上限','連動另一面名稱','連動另一面分類'],
          ['飛彈魔杖','武器','日常等級','50','1','神奇護甲','護甲'],
          ['藥水','消耗品','日常等級','10','','',''],
        ];
        const helpRows=[
          ['欄位','說明'],
          ['名稱','商品名稱，必填。'],
          ['分類','例如：武器、護甲、消耗品，用來在商店/GM區分組顯示。'],
          ['等級','商品等級，格式不拘，只要同一等級打法前後一致。留空代表永遠開放。'],
          ['價格','這件商品的購買參考售價（賣出時系統仍會另外詢問實際賣出金額）。'],
          ['數量上限','這張卡在場上最多能同時持有幾件，留空代表沒有上限。'],
          ['連動另一面名稱','雙面卡專用，選填。只需要在「正面」那一列填寫，系統會自動幫你建立背面那張卡並完成連動。'],
          ['連動另一面分類','雙面卡專用，選填。填另一面的分類。'],
          ['',''],
          ['⚠️ 雙面卡不能同名','連動的正反兩面「名稱」不能完全一樣，系統是用名稱去分辨每一張卡的。建議取名時讓兩面名稱有些微差異，例如「飛彈魔杖(武器)」跟「飛彈魔杖(護甲)」。'],
        ];
        const wb=XLSX.utils.book_new();
        const ws1=XLSX.utils.aoa_to_sheet(templateRows);
        ws1['!cols']=[{wch:16},{wch:10},{wch:10},{wch:8},{wch:10},{wch:16},{wch:14}];
        XLSX.utils.book_append_sheet(wb,ws1,'範本');
        const ws2=XLSX.utils.aoa_to_sheet(helpRows);
        ws2['!cols']=[{wch:18},{wch:70}];
        XLSX.utils.book_append_sheet(wb,ws2,'使用說明');
        XLSX.writeFile(wb,'商店卡牌匯入範例.xlsx');
      }).catch(e=>{console.error(e);alert('範本產生失敗，請檢查網路連線')});
    }
    function parseShopExcelRows(rows){
      let added=0;
      const linkedItems=[];
      rows.forEach(row=>{
        const name=String(row['名稱']||'').trim();
        if(!name)return;
        const category=String(row['分類']||'').trim();
        const level=String(row['等級']||'').trim();
        const priceRaw=row['價格'];
        const price=(priceRaw===undefined||priceRaw==='')?null:Math.max(0,parseInt(priceRaw,10)||0);
        const capRaw=row['數量上限'];
        const cap=(capRaw===undefined||capRaw==='')?null:Math.max(0,parseInt(capRaw,10)||0);
        const backName=String(row['連動另一面名稱']||'').trim();
        const backCategory=String(row['連動另一面分類']||'').trim();
        let item=shopCatalog.find(x=>x.name===name);
        if(!item){item={id:uuid(),name,category,level,price,cap,boughtCount:0,individuallyOpen:false,linkedNames:[]};shopCatalog.push(item);added++}
        else{item.category=category||item.category;item.level=level||item.level;if(price!=null)item.price=price;if(cap!=null)item.cap=cap}
        if(backName){item.backName=backName;item.backCategory=backCategory;linkedItems.push(item)}
      });
      linkedItems.forEach(item=>syncShopLinkedCounterpart(item));
      return added;
    }
    function handleShopExcelImport(file){
      const statusEl=document.querySelector('#shopExcelStatus');
      if(statusEl)statusEl.textContent='讀取中…';
      ensureXLSXLoaded().then(()=>file.arrayBuffer()).then(buf=>{
        const wb=XLSX.read(buf,{type:'array'});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
        const added=parseShopExcelRows(rows);
        scheduleShopAutosave();
        renderGmPanel();
        const msg=`匯入完成，新增 ${added} 張商品卡`;
        if(statusEl)statusEl.textContent=msg;
      }).catch(e=>{
        console.error(e);
        const msg='匯入失敗，請確認檔案格式是否正確，或檢查網路連線（第一次匯入需要下載 Excel 解析套件）';
        if(statusEl)statusEl.textContent=msg;
      });
    }
    function renderGmPanel(){
      const wrap=document.querySelector('#gmPanelContent');
      if(!wrap)return;
      const open=openShopSections.has('gm:shop');
      const excelOpen=openShopSections.has('gm:excel');
      wrap.innerHTML=`
        <details class="shop-section" data-shopsec="gm:excel" ${excelOpen?'open':''}><summary class="shop-section-head"><span>📊 Excel 批次匯入商品卡</span><span class="shop-chev">▸</span></summary><div class="shop-section-body">
          <p class="shop-hint" style="margin-bottom:10px">欄位如下（第一列要是標題）：<br><span class="shop-hint" style="font-family:monospace">名稱｜分類｜等級｜價格｜數量上限｜連動另一面名稱｜連動另一面分類</span><br><br>雙面卡只需要填「正面」那一列，系統會自動建立背面那張卡並完成連動。下載範例試算表後，裡面有「使用說明」分頁詳細解釋每個欄位。</p>
          <div class="toolbar">
            <button type="button" id="btnShopExcelTemplate">⬇️ 下載範例試算表</button>
            <button type="button" class="primary" id="btnShopExcelImport">📥 選擇檔案匯入</button>
          </div>
          <input type="file" id="shopExcelInput" accept=".xlsx,.xls,.csv" hidden>
          <p class="shop-hint" id="shopExcelStatus" style="margin-top:8px"></p>
        </div></details>
        <details class="shop-section" data-shopsec="gm:shop" ${open?'open':''}><summary class="shop-section-head"><span>🏪 商店卡牌管理（${shopCatalog.length}）</span><span class="shop-chev">▸</span></summary><div class="shop-section-body">${renderGmShopSection()}</div></details>
      `;
      wrap.querySelectorAll('details[data-shopsec]').forEach(d=>{
        d.addEventListener('toggle',()=>{const id=d.dataset.shopsec;if(d.open)openShopSections.add(id);else openShopSections.delete(id)});
      });
      const tplBtn=document.querySelector('#btnShopExcelTemplate');
      if(tplBtn)tplBtn.addEventListener('click',downloadShopExcelTemplate);
      const impBtn=document.querySelector('#btnShopExcelImport');
      if(impBtn)impBtn.addEventListener('click',()=>document.querySelector('#shopExcelInput').click());
      const impInput=document.querySelector('#shopExcelInput');
      if(impInput)impInput.addEventListener('change',e=>{if(e.target.files[0])handleShopExcelImport(e.target.files[0]);e.target.value=''});
      renderShopPanel();
    }
    document.querySelector('#shopGmFab').addEventListener('click',addBlankShopCard);
    document.querySelector('#gmPanelContent')?.addEventListener('focusin',ev=>{
      if(ev.target.classList?.contains('gm-f')&&(ev.target.dataset.gmF==='name'||ev.target.dataset.gmF==='backName')){
        ev.target.dataset.origValue=ev.target.value;
      }
    });
    document.addEventListener('focusin',ev=>{
      if(ev.target.closest&&ev.target.closest('#gmPanelContent')&&ev.target.classList.contains('gm-f')&&(ev.target.dataset.gmF==='name'||ev.target.dataset.gmF==='backName')){
        ev.target.dataset.origValue=ev.target.value;
      }
    });
    document.addEventListener('input',ev=>{
      if(!(ev.target.closest&&ev.target.closest('#gmPanelContent')))return;
      if(!ev.target.classList.contains('gm-f'))return;
      const id=ev.target.dataset.gmId,f=ev.target.dataset.gmF;
      const item=shopCatalog.find(x=>x.id===id);if(!item)return;
      if(f==='price')item.price=ev.target.value.trim()===''?null:Math.max(0,parseInt(ev.target.value,10)||0);
      else if(f==='cap')item.cap=ev.target.value.trim()===''?null:Math.max(0,parseInt(ev.target.value,10)||0);
      else item[f]=ev.target.value;
      scheduleShopAutosave();
    });
    document.addEventListener('change',ev=>{
      if(!(ev.target.closest&&ev.target.closest('#gmPanelContent')))return;
      if(ev.target.classList.contains('gm-indiv')){
        const item=shopCatalog.find(x=>x.id===ev.target.dataset.gmId);
        if(item){item.individuallyOpen=ev.target.checked;scheduleShopAutosave()}
        return;
      }
      if(ev.target.classList.contains('lvl-check')){
        const lv=ev.target.dataset.gmLvl;
        if(ev.target.checked){if(!shopUnlockedLevels.includes(lv))shopUnlockedLevels.push(lv)}
        else shopUnlockedLevels=shopUnlockedLevels.filter(x=>x!==lv);
        scheduleShopAutosave();
        return;
      }
      if(ev.target.classList.contains('lc-check')){
        const key=ev.target.dataset.lcKey;
        if(ev.target.checked){if(!shopUnlockedLevelCats.includes(key))shopUnlockedLevelCats.push(key)}
        else shopUnlockedLevelCats=shopUnlockedLevelCats.filter(x=>x!==key);
        scheduleShopAutosave();
        return;
      }
      if(!ev.target.classList.contains('gm-f'))return;
      const id=ev.target.dataset.gmId,f=ev.target.dataset.gmF;
      const item=shopCatalog.find(x=>x.id===id);if(!item)return;
      if(f==='name'){
        const oldName=ev.target.dataset.origValue;
        const newName=item.name.trim();
        if(oldName&&oldName!==newName&&newName){
          const ok=renameShopCardEverywhere(oldName,newName);
          if(ok===false){item.name=oldName;renderGmPanel();return}
        }
      }
      if(f==='backName'){
        const oldBackName=(ev.target.dataset.origValue||'').trim();
        const newBackName=item.backName.trim();
        if(oldBackName&&oldBackName!==newBackName&&newBackName&&item.linkedNames&&item.linkedNames.includes(oldBackName)){
          const ok=renameShopCardEverywhere(oldBackName,newBackName);
          if(ok===false){item.backName=oldBackName;renderGmPanel();return}
          scheduleShopAutosave();renderGmPanel();return;
        }
      }
      scheduleShopAutosave();
      if(f==='backName'||f==='backCategory'){
        const counterpart=syncShopLinkedCounterpart(item);
        if(counterpart){
          renderGmPanel();
          requestAnimationFrame(()=>{const el=document.getElementById('gmcard-'+counterpart.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})});
        }
        return;
      }
      if(ev.target.classList.contains('gm-regroup'))renderGmPanel();
    });
    document.querySelector('#gmPanelContent')?.addEventListener('click',ev=>{
      const addCard=ev.target.closest('[data-gm-addcard]');
      if(addCard){addBlankShopCard();return}
      const forceLink=ev.target.closest('.gm-force-link');
      if(forceLink){
        const item=shopCatalog.find(x=>x.id===forceLink.dataset.gmForce);
        if(item){
          const backName=(item.backName||'').trim();
          if(!backName)alert('請先填寫「背面名稱」');
          else if(backName===item.name)alert('「背面名稱」不能跟這張卡自己的名稱一樣');
          else{const counterpart=syncShopLinkedCounterpart(item);if(counterpart){scheduleShopAutosave();renderGmPanel()}}
        }
        return;
      }
      const delCard=ev.target.closest('[data-gm-del]');
      if(delCard){
        const item=shopCatalog.find(x=>x.id===delCard.dataset.gmDel);
        if(item){
          const group=getCardGroup(item.name);
          const others=group.filter(n=>n!==item.name);
          const msg=others.length?`確定要刪除「${item.name}」嗎？它是雙面卡，連動的「${others.join('、')}」也會一併刪除。`:`確定要刪除「${item.name}」這張卡牌嗎？`;
          if(confirm(msg)){
            shopCatalog=shopCatalog.filter(x=>!group.includes(x.name));
            scheduleShopAutosave();renderGmPanel();
          }
        }
        return;
      }
    });

    /* ---- 浮動篩選／跳轉視窗 ---- */

    function closeShopNavOverlay(){document.querySelector('#shopNavOverlay').classList.remove('show')}
    document.querySelector('#shopNavFab').addEventListener('click',openShopNavOverlay);
    document.querySelector('#shopNavCloseX').addEventListener('click',closeShopNavOverlay);
    document.querySelector('#shopNavOverlay').addEventListener('click',ev=>{if(ev.target.id==='shopNavOverlay')closeShopNavOverlay()});
    function renderShopNavOverlay(){
      const body=document.querySelector('#shopNavBody');
      if(activeTab==='shop'){
        const items=visibleShopItems();
        const levels=Array.from(new Set(items.map(it=>it.level||'（無等級）')));
        const cats=Array.from(new Set(items.filter(it=>!shopLevelFilter||(it.level||'（無等級）')===shopLevelFilter).map(it=>it.category||'未分類')));
        const allCats=Array.from(new Set(items.map(it=>it.category||'未分類')));
        body.innerHTML=`
          <h3>🧭 跳轉分類（不套用篩選，全部分類都看得到）</h3>
          <p class="shop-hint" style="margin-bottom:8px">直接跳到某個分類，不會隱藏其他分類，方便你來回切換查看。</p>
          <div class="shop-picker-list" style="margin-bottom:16px">
            ${allCats.map(c=>`<button type="button" class="shop-picker-btn" data-shopnav-jump="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('')}
          </div>
          <h3>篩選商店</h3>
          <p class="shop-hint" style="font-weight:700">等級</p>
          <div class="shop-picker-list" style="margin-bottom:14px">
            <button type="button" class="shop-picker-btn" data-shopnav-lvl="">全部等級</button>
            ${levels.map(lv=>`<button type="button" class="shop-picker-btn" data-shopnav-lvl="${escapeAttr(lv)}">${escapeHtml(lv)}</button>`).join('')}
          </div>
          <p class="shop-hint" style="font-weight:700">分類</p>
          <div class="shop-picker-list">
            <button type="button" class="shop-picker-btn" data-shopnav-cat="">全部分類</button>
            ${cats.map(c=>`<button type="button" class="shop-picker-btn" data-shopnav-cat="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('')}
          </div>
        `;
      }else if(activeTab==='gm'){
        const shopLevels=Array.from(new Set(shopCatalog.map(it=>it.level||'未分級')));
        const shopCats=Array.from(new Set(shopCatalog.filter(it=>!gmShopFilter||!gmShopFilter.level||(it.level||'未分級')===gmShopFilter.level).map(it=>it.category||'未分類')));
        body.innerHTML=`
          <h3>🏪 商店卡牌：篩選／跳轉</h3>
          <p class="shop-hint" style="font-weight:700">等級</p>
          <div class="shop-picker-list" style="margin-bottom:10px">${shopLevels.map(lv=>`<button type="button" class="shop-picker-btn" data-gmnav="shoplvl" data-val="${escapeAttr(lv)}">${gmShopFilter&&gmShopFilter.level===lv?'✓ ':''}${escapeHtml(lv)}</button>`).join('')}</div>
          <p class="shop-hint" style="font-weight:700">分類</p>
          <div class="shop-picker-list" style="margin-bottom:10px">${shopCats.map(c=>`<button type="button" class="shop-picker-btn" data-gmnav="shopcat" data-val="${escapeAttr(c)}">${gmShopFilter&&gmShopFilter.category===c?'✓ ':''}${escapeHtml(c)}</button>`).join('')}</div>
          ${gmShopFilter?'<button type="button" class="shop-picker-btn" data-gmnav="shopclear" style="width:100%">✕ 清除篩選</button>':''}
        `;
      }
    }
    document.querySelector('#shopNavBody').addEventListener('click',ev=>{
      const jumpBtn=ev.target.closest('[data-shopnav-jump]');
      if(jumpBtn){
        const cat=jumpBtn.dataset.shopnavJump;
        shopLevelFilter='';shopCatFilter='';
        const secId='shop:all:'+cat;
        openShopSections.add(secId);
        renderShopPanel();
        closeShopNavOverlay();
        requestAnimationFrame(()=>{
          const el=document.querySelector(`[data-shopsec="${CSS.escape(secId)}"]`);
          if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
        });
        return;
      }
      const navLvl=ev.target.closest('[data-shopnav-lvl]');
      if(navLvl){shopLevelFilter=navLvl.dataset.shopnavLvl;shopCatFilter='';renderShopPanel();renderShopNavOverlay();return}
      const navCat=ev.target.closest('[data-shopnav-cat]');
      if(navCat){shopCatFilter=navCat.dataset.shopnavCat;renderShopPanel();renderShopNavOverlay();return}
      const gmNav=ev.target.closest('[data-gmnav]');
      if(gmNav){
        const kind=gmNav.dataset.gmnav,val=gmNav.dataset.val;
        if(kind==='shoplvl')gmShopFilter={level:val,category:(gmShopFilter&&gmShopFilter.category)||null};
        else if(kind==='shopcat')gmShopFilter={level:(gmShopFilter&&gmShopFilter.level)||null,category:val};
        else if(kind==='shopclear')gmShopFilter=null;
        renderGmPanel();renderShopNavOverlay();
        return;
      }
    });
    updateStorageUsageDisplay();
    render();
    (function(){
      const tabbar=document.querySelector('#bottomTabbar');
      if(!tabbar)return;
      tabbar.addEventListener('click',event=>{
        const btn=event.target.closest('button[data-target]');
        if(!btn)return;
        const tab=TAB_SECTION_TO_TAB[btn.dataset.target];
        if(tab)setActiveTab(tab,{scroll:true});
      });
    })();
    updateTabbarHeightVar();
    setActiveTab(activeTab,{scroll:false});
  </script>
</body>
</html>
